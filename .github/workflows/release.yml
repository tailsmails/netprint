name: Auto Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: netprint
  EXTRA_FLAGS: "-d vnm_f64"

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y musl-tools
            build_cmd: |
              v $EXTRA_FLAGS -enable-globals -prod -autofree -os linux -o $APP_NAME.c .
              musl-gcc -O3 -static $APP_NAME.c -o $APP_NAME-linux-amd64 -lm
            artifact_suffix: -linux-amd64

          - target: linux-arm64
            runner: ubuntu-latest
            setup_cmd: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            build_cmd: |
              v $EXTRA_FLAGS -enable-globals -prod -autofree -os linux -o $APP_NAME.c .
              aarch64-linux-gnu-gcc -O3 -static $APP_NAME.c -o $APP_NAME-linux-arm64 -lm
            artifact_suffix: -linux-arm64

          - target: android-arm64
            runner: ubuntu-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -enable-globals -prod -autofree -os android -o $APP_NAME.c .
              $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang -O3 -fPIE -pie $APP_NAME.c -o $APP_NAME-android-arm64 -llog -lm
            artifact_suffix: -android-arm64

          - target: android-arm
            runner: ubuntu-latest
            setup_cmd: ""
            build_cmd: |
              v $EXTRA_FLAGS -enable-globals -prod -autofree -os android -o $APP_NAME.c .
              $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang -O3 -fPIE -pie $APP_NAME.c -o $APP_NAME-android-arm -llog -lm
            artifact_suffix: -android-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Setup Compiler Dependencies
        if: matrix.setup_cmd != ''
        run: ${{ matrix.setup_cmd }}

      - name: Setup Dependencies
        run: v install --git https://github.com/tailsmails/vnm

      - name: Build binary
        run: ${{ matrix.build_cmd }}

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          artifacts: ${{ env.APP_NAME }}${{ matrix.artifact_suffix }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
